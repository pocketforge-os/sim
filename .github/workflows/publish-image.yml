# ══════════════════════════════════════════════════════════════════════════════════════════════
# ENABLED 2026-07-26 (owner decision, ticket 01KYEE9R013A6KF9JAG5ECHMF8). Kill switch: set the
# repo variable SIM_PUBLISH_ENABLED to anything but 'true' (job guard below) — no revert needed.
# ══════════════════════════════════════════════════════════════════════════════════════════════
# This workflow publishes the pinned `pocketforge-sim` image to ghcr.io. It is MERGED but INERT:
# it CANNOT publish until the owner enables it. Two independent guards keep it off:
#
#   1. TRIGGERS — only `workflow_dispatch` is active. The real `push`/tag triggers that make
#      publishing automatic are written below in a commented `# on-enable:` block, ready to
#      uncomment. Until then nothing (not even a main merge or a release tag) invokes this.
#   2. JOB GUARD — `if: ${{ vars.SIM_PUBLISH_ENABLED == 'true' }}`. Even a manual dispatch is a
#      NO-OP until the owner sets the repo variable `SIM_PUBLISH_ENABLED=true`.
#
# TO ENABLE (owner action, after the owner-decision checklist in docs/IMAGE-PUBLISHING.md §8 is
# answered YES):
#   a. Set repo variable `SIM_PUBLISH_ENABLED=true`  (Settings → Secrets and variables → Actions
#      → Variables), or via:  gh variable set SIM_PUBLISH_ENABLED -b true -R pocketforge-os/sim
#   b. Uncomment the `# on-enable:` push/tag trigger block below (replace the workflow_dispatch-only
#      `on:`), so main merges + `v*` release tags publish automatically.
#   c. Confirm the CI GITHUB_TOKEN may publish packages + set the package's initial visibility
#      (public vs private — owner decision #2). See docs/IMAGE-PUBLISHING.md §7.
#
# DESIGN: docs/IMAGE-PUBLISHING.md. Runs on a GITHUB-HOSTED runner (ubuntu-latest), NOT the
# self-hosted trimui-build-lab — publishing only BUILDS the image (no nested-sim caps needed), and
# this keeps the Dell runner's exposure unchanged (infra-113 D11). Authenticates with the built-in
# Actions GITHUB_TOKEN + `packages: write` — NOT the pocketforge-agent App token (which has no
# packages:write, by design; see docs/IMAGE-PUBLISHING.md §7 + .claude/rules/secrets.md).
# ══════════════════════════════════════════════════════════════════════════════════════════════

name: publish-image

# ENABLED (owner decision 2026-07-26, ticket 01KYEE9R013A6KF9JAG5ECHMF8, bead tsp-65jc.9):
# publishing fires on main merges + semver release tags; workflow_dispatch retained for re-runs.
# The SIM_PUBLISH_ENABLED repo variable (set true 2026-07-26) remains the job-level kill switch.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Least-privilege: read the source, write the package, and (for attestation) mint an OIDC token +
# write attestations. Nothing else. `packages: write` here is the WORKFLOW GITHUB_TOKEN scope — it
# does NOT touch the pocketforge-agent App install token (docs/IMAGE-PUBLISHING.md §7).
permissions:
  contents: read
  packages: write
  id-token: write        # actions/attest-build-provenance (OIDC)
  attestations: write    # actions/attest-build-provenance

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false   # never cancel an in-flight publish

jobs:
  publish:
    # GUARD #2: inert until the owner sets SIM_PUBLISH_ENABLED=true (see header). A manual dispatch
    # with the variable unset skips with a green no-op.
    if: ${{ vars.SIM_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest       # GitHub-hosted (design §4 / D11) — NOT self-hosted; build-only, no sim caps
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/sim
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (repo requires SHA-pinned actions)

      # NOTE (tsp-65jc.9 startup_failure fix, 2026-07-26): the org allowed-actions policy is
      # `selected` (github-owned + pocketforge-os/* + aws-actions/*), so the docker/* marketplace
      # actions (login/metadata/buildx/build-push) are REJECTED at workflow startup. Rather than
      # widening org governance, the same work is done below with plain `docker` run steps —
      # fewer third-party supply-chain deps, same result. actions/checkout + attest-build-provenance
      # are github-owned and stay.

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        # workflow token, packages:write — NOT the App token

      - name: Derive tags
        id: meta
        run: |
          set -euo pipefail
          short="sha-$(git rev-parse --short=12 HEAD)"
          tags="$short"
          ref="${GITHUB_REF}"
          if [[ "$ref" == refs/heads/* ]]; then
            tags="$tags ${ref#refs/heads/}"
          elif [[ "$ref" == refs/tags/v* ]]; then
            ver="${ref#refs/tags/v}"
            tags="$tags v${ver} ${ver%.*} latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "derived tags: $tags"
          # main -> :main + :sha-<short> (immutable); release tag v* -> :vX.Y.Z + :X.Y + :latest.
          # Moving tags (main/latest) are conveniences; consumers PIN THE DIGEST (design §3/§6).

      - name: Build + push the lean runtime image
        id: build
        run: |
          set -euo pipefail
          docker build \
            --target runtime \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "$IMAGE:tmp-build" .
          for t in ${{ steps.meta.outputs.tags }}; do
            docker tag "$IMAGE:tmp-build" "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:tmp-build" | cut -d@ -f2)
          [ -n "$digest" ] || { echo "no digest after push"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "published digest: $digest"
          # target runtime = the lean CI/dev image (NOT demo); design §2

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # ── IPFS SOVEREIGN-MIRROR HALF (tsp-65jc.25, coordinator-ruled Option B) ─────────────────
      # ghcr stays the PRIMARY operational layer; we ALSO export the exact published image (BY
      # DIGEST) as an OCI archive and record its deterministic IPFS CID beside the ghcr digest,
      # then upload the archive as a run artifact. The ACTUAL pin is a laptop/ops-side step
      # (pocketforge-automation/scripts/pf-sim-ipfs-mirror.sh) using the existing laptop-custodied
      # trust/dell-kubo-api credential — DELIBERATELY: IPFS-publish credentials stay laptop-side
      # (tsp-77b custody posture), so this CI half mints NOTHING and reaches no pinning API. It only
      # produces the canonical bytes + their CID. The companion pins THESE EXACT artifact bytes, so
      # the CID is identical by construction. See docs/IMAGE-PUBLISHING.md §9 (+ §10 for the
      # optional future upgrade to a CI-side pin, an owner decision). All plain `run:` steps + one
      # github-owned action — no third-party marketplace action (org allowed-actions=selected).

      - name: Install pinned kubo (offline CID hashing)
        run: |
          set -euo pipefail
          # Pinned to match image/kubo.pin (kubo 0.42.0) so the offline CID uses the SAME
          # unixfs-v1-2025 profile the rest of the project pins with. Verify BOTH the dist tarball
          # (sha512, upstream-published) AND the extracted binary (sha256) fail-closed.
          KUBO_VER=0.42.0
          KUBO_TARBALL_SHA512=054c38a0cf66f7d738e25085ad62cb3a42d03d4bac329b7dd25c1d71cf18e1ce87d55b1d1b705b04c65210dca9109973579e0eb1cd72f6341ecb3311d840d156
          KUBO_BINARY_SHA256=a2bcd470ee4c5df3cfc7f11d8acb7b10ab6cadbf0fd8cb079c77fd303746ee4d
          tgz="kubo_v${KUBO_VER}_linux-amd64.tar.gz"
          curl -fsSL "https://dist.ipfs.tech/kubo/v${KUBO_VER}/${tgz}" -o "$tgz"
          echo "${KUBO_TARBALL_SHA512}  ${tgz}" | sha512sum -c -
          tar xzf "$tgz"
          echo "${KUBO_BINARY_SHA256}  kubo/ipfs" | sha256sum -c -
          sudo install -m0755 kubo/ipfs /usr/local/bin/ipfs
          ipfs --version

      - name: Export published image (by digest) as an OCI archive
        id: oci
        run: |
          set -euo pipefail
          command -v skopeo >/dev/null || { sudo apt-get update && sudo apt-get install -y skopeo; }
          digest='${{ steps.build.outputs.digest }}'      # sha256:...
          hex="${digest#sha256:}"
          archive="pocketforge-sim-${hex}.oci.tar"
          # Copy the EXACT manifest+config+layers from ghcr BY DIGEST into an OCI archive. skopeo
          # copies the manifest blob byte-for-byte, so `skopeo inspect --raw` of this archive hashes
          # back to the ghcr digest (the round-trip equality proof), independent of tar packaging.
          # --preserve-digests is LOAD-BEARING: `docker push` writes a Docker schema-2 manifest, and
          # skopeo would otherwise CONVERT it to OCI media types on copy — changing the manifest bytes
          # and thus the digest (reproduced: archive digest != ghcr digest without this flag). With it,
          # the original manifest is stored byte-for-byte, so `skopeo inspect --raw` hashes back to the
          # ghcr digest. NB: no ref suffix on the oci-archive dest — a ghcr ref contains ':' (sha256:)
          # and '@' which collide with skopeo's `oci-archive:path[:ref]` colon parsing; a single-image
          # archive needs no ref (`skopeo inspect --raw` / a docker-daemon load resolve the one image).
          skopeo copy --quiet --preserve-digests \
            --src-creds "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" \
            "docker://${IMAGE}@${digest}" \
            "oci-archive:${archive}"
          # Sanity: the archive's own manifest digest must equal the ghcr digest.
          got="sha256:$(skopeo inspect --raw "oci-archive:${archive}" | sha256sum | cut -d' ' -f1)"
          [ "$got" = "$digest" ] || { echo "manifest-digest mismatch: archive=$got ghcr=$digest"; exit 1; }
          echo "archive=${archive}" >> "$GITHUB_OUTPUT"
          echo "exported ${archive} ($(stat -c%s "$archive") bytes); manifest digest verified == ${digest}"

      - name: Compute deterministic IPFS CID (offline, unixfs-v1-2025)
        id: cid
        run: |
          set -euo pipefail
          archive='${{ steps.oci.outputs.archive }}'
          export IPFS_PATH="$(mktemp -d)"
          ipfs init --profile=lowpower >/dev/null 2>&1
          # unixfs-v1-2025 (IPIP-499): CIDv1, raw-leaves, sha2-256, 1 MiB chunks. --only-hash means
          # we compute the CID WITHOUT adding to any store — no network, no pin, no credential.
          # The flag set MUST match the companion pinner's `ipfs add` EXACTLY (proven byte-identical:
          # --only-hash CID == real add CID), so the CID here == the CID the pinner produces for the
          # SAME artifact bytes uploaded below. Do not drift these flags out of lockstep with
          # pocketforge-automation/scripts/pf-sim-ipfs-mirror.sh.
          cid="$(ipfs add --only-hash --cid-version=1 --raw-leaves --chunker=size-1048576 \
                   --hash sha2-256 --quieter "$archive")"
          rm -rf "$IPFS_PATH"
          [ -n "$cid" ] || { echo "empty CID"; exit 1; }
          echo "cid=${cid}" >> "$GITHUB_OUTPUT"
          echo "deterministic CID (unixfs-v1-2025): ${cid}"

      - name: Upload OCI archive as a run artifact (the ops-side pin source)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ steps.oci.outputs.archive }}
          path: ${{ steps.oci.outputs.archive }}
          if-no-files-found: error
          retention-days: 90

      - name: Record published digest + IPFS mirror pair
        run: |
          cid='${{ steps.cid.outputs.cid }}'
          archive='${{ steps.oci.outputs.archive }}'
          {
            echo "### Published \`${IMAGE}\`"
            echo ""
            echo "**ghcr (primary, operational):**"
            echo "- **digest:** \`${{ steps.build.outputs.digest }}\`"
            echo "- **tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "**IPFS (sovereign mirror):**"
            echo "- **CID (unixfs-v1-2025):** \`${cid}\`"
            echo "- **OCI archive:** \`${archive}\` (uploaded as a run artifact; the join key to the ghcr digest above)"
            echo "- **Pin status:** NOT pinned by CI. Pinned ops-side from the laptop (credentials stay laptop-side, tsp-77b):"
            echo '  ```'
            echo "  pocketforge-automation/scripts/pf-sim-ipfs-mirror.sh pin --run ${{ github.run_id }}"
            echo '  ```'
            echo "  which pins THESE artifact bytes → the SAME CID above, fetchable at https://ipfs.pocketforge.org/ipfs/${cid}"
            echo ""
            echo "The DIGEST is the join key across both channels; consumers pin the DIGEST, not a moving tag (docs/IMAGE-PUBLISHING.md §6/§9)."
          } >> "$GITHUB_STEP_SUMMARY"

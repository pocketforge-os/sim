name: sim-gate

# E5 simulator headless CI gate (tsp-qc1.4 / wires infra-106 E7). Builds the reproducible
# `pocketforge-sim` image from PINNED refs (no /home/mm, no host toolchain) and runs the headless
# suite NESTED in the container on every PR to main.
#
# ADVISORY first: this is NOT a required status check, so a red run does not block merge. Flip to
# BLOCKING by adding the `headless-suite` job to main's branch-protection required checks — the
# a133 row is the blocking key (a523 rows run non-blocking, infra-113 D2 descope). See the
# "GATE SCOPE / POSTURE / FORK-SKIP" block below for the full contract before relying on this gate.
#
# Runs on the self-hosted Dell device-lab runner (org runner `trimui-build-lab`, labels
# self-hosted+docker). It needs /dev/uinput + the scoped cap set from docker/README.md (the
# tsp-qc1.2 nesting verdict) — lighter than --privileged, no host AppArmor change. No ghcr push
# (build-then-run, per the owner decision).
#
# ═══════════════════ GATE SCOPE · HONESTY CONTRACT · POSTURE · FORK-SKIP (infra-113 B1) ═══════════════════
# WHAT THIS GATE PROVES — the LOGICAL layer ONLY (canonical: sim/docs/HONESTY-CONTRACT.md;
# restated in every gate's docs per infra-113 §4). check-control / check-sensor / check-skin
# assert descriptor correctness, input mapping (evdev codes → SDL3 gamepad enumeration),
# capability/permission semantics, graceful missing-hardware degradation, accessibility-preference
# propagation, and per-variant button/skin coverage (a133 vs a523 = data, not code) — cheaply,
# off-hardware, in CI, on every PR.
#
# WHAT IT IS **NOT** HONEST ABOUT — these FIVE things are NOT proven here and a green run MUST NOT
# be read as covering them; they stay the flash → serial → webcam HARDWARE gate's SOLE authority
# (the two gates are complementary, never substitutes):
#   1. GPU blobs — the closed PowerVR UM/KM and the dc_sunxi → DE2.0 → fb0 path are not reproduced;
#      a sim "cube renders" proves NOTHING on-device (the suites run SDL with no video backend).
#   2. Real WiFi flakiness — the XR819/xr829 lossy-link reality (DHCP-up-but-TCP-dead) cannot be
#      mocked faithfully; network E2E stays on hardware.
#   3. Timing / perf / thermal — qemu-user timing ≠ A53/A55; no soak, no fan/thermal behavior.
#   4. Isolation / enforcement — guest seccomp is unenforceable under qemu-user; the sim proves the
#      capability/permission CONTRACT + ergonomics, NOT that a hostile app is confined.
#   5. Per-SoC graphics — divergent display stacks (A133 sunxifb/no-KMS/fb0 vs A523 kmsdrm/Mali/
#      DRM-KMS) are per-SoC code + build, not descriptor data; the software-render fb proves neither.
#
# POSTURE (infra-113 D3/D4) — ADVISORY TODAY: this is NOT yet a required status check, so a red run
# does not block merge. Treat a red advisory run as a real failure anyway — fix it, do not merge
# past it (infra-113 §7). Phase B2 FLIPS this to BLOCKING (adds `headless-suite` to main's
# branch-protection required checks) once the a133 row is current + stable across enough runs; a133
# is the blocking key, a523 runs non-blocking (D2). A negative control — descriptor-row deletion →
# red — is demonstrated before the flip (infra-113 B1).
#
# FORK-SKIP SEMANTICS (infra-113 finding 10 / D4 — stated plainly): the job-level fork guard below
# makes this job SKIP for any PR whose head repo is not this repository. GitHub treats a SKIPPED
# required check as SATISFIED — so once B2 makes this a required check, a fork PR's skip counts as a
# pass and this gate does NOT actually gate fork PRs. That is an accepted, conscious decision: the
# build-lab confinement invariant (tsp-20u1) forbids executing fork/public-PR code on this
# self-hosted docker = host-root runner, so a fork PR cannot run the suite here by design. Fork
# contributions are validated by an org member re-pushing the change to an in-repo branch (which
# DOES run the gate) before merge.
# ══════════════════════════════════════════════════════════════════════════════════════════════════════
#
# SECURITY POSTURE (tsp-j5y, 2026-07-03). This job runs PR-authored code on a self-hosted runner
# that has docker host-root + the elevated container cap set below (SYS_ADMIN + unconfined
# apparmor/seccomp) — those caps are IRREDUCIBLE: the nested bwrap sandbox must create namespaces
# and do mount/pivot_root, and the suite needs the host `/dev/uinput` + evdev nodes, so this cannot
# run on a GitHub-hosted runner and the caps cannot be dropped without breaking the tsp-qc1.2
# verdict. The untrusted-code exposure is instead confined by three layers (tsp-j5y; hardened by
# tsp-20u1, the build-lab confinement invariant — "trimui-build-lab never executes fork/public-PR
# code", canonical doc in mission-control BUILD_PIPELINE.md):
#   1. MECHANICAL fork guard — the job-level `if:` below skips this job for any PR whose head repo
#      is not this repository, so even a maintainer-APPROVED fork PR never executes here (tsp-20u1).
#   2. Fork / outside-contributor PRs are approval-gated (org actions fork-pr-contributor-approval =
#      all_external_contributors) — defense-in-depth beneath the guard.
#   3. `trimui-build-lab` lives in a dedicated org runner group (`build-lab`, visibility=selected)
#      whose repo allow-list is only the trusted set {sim, pf-hwprobe, infra, kernel-tsp (archived,
#      inert)} (tsp-j5y D1; audited tsp-20u1) — no other repo can reach this runner.
# The two hardenings below are the workflow-level defense-in-depth that does NOT alter the tested
# cap set: a least-privilege GITHUB_TOKEN, and a network-isolated RUN phase (the headless suite is
# fully offline from baked, pinned artifacts — see docker/README.md).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN for a job that executes untrusted PR code. The suite neither reads
# repo contents beyond the checkout nor writes anything back, so read-only contents is sufficient.
permissions:
  contents: read

concurrency:
  group: sim-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless-suite:
    # Build-lab confinement invariant (tsp-20u1): this self-hosted runner has
    # docker = host root and must NEVER execute fork/public-PR code — the org
    # approval gate alone still lets an approved fork PR run here, so this
    # guard makes the invariant MECHANICAL: skip the job whenever the PR head
    # is not this repository. Advisory check, so a skip blocks nobody.
    # Canonical doc: mission-control BUILD_PIPELINE.md "Build-lab confinement
    # invariant".
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, docker]
    timeout-minutes: 45
    env:
      IMG: pocketforge-sim:ci-${{ github.run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4 (repo requires SHA-pinned actions)

      - name: Ensure uinput module (host node is required for the nested sim)
        run: sudo modprobe uinput || true

      - name: Build pocketforge-sim (pinned, reproducible-from-clean)
        run: docker build -t "$IMG" .

      # --network none: the headless suite runs entirely from baked, pinned artifacts (no
      # out-of-band input — docker/README.md), so denying the RUN phase any network shrinks the
      # blast radius of malicious PR code executing under the elevated caps (no exfil / callout).
      # The build phase above keeps its network (apt + pinned clones). NOTE(reviewer): confirm the
      # nested qemu-tsp/bwrap path needs no loopback/network; if it does, drop `--network none`.
      - name: check-control a133 a523 (ALL DEVICES PASS, native==qemu byte-identical)
        run: |
          docker run --rm --network none \
            --device /dev/uinput --device-cgroup-rule "c 13:* rmw" -v /dev/input:/dev/input \
            --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt seccomp=unconfined \
            "$IMG" check-control a133 a523

      - name: check-sensor a133 a523 (ALL DEVICES PASS, native==qemu byte-identical)
        run: |
          docker run --rm --network none \
            --device /dev/uinput --device-cgroup-rule "c 13:* rmw" -v /dev/input:/dev/input \
            --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt seccomp=unconfined \
            "$IMG" check-sensor a133 a523

      # check-skin joins the gate as of tsp-65jc.1 (infra-113 A1): the doc §5 gate matrix lists
      # check-skin as an a133 suite, and A1's first-class item is verifying the .scad-rendered skin
      # end-to-end (GUI-click==headless-inject + compositor geometry, native==qemu byte-identical).
      # Running it here means the PR's own CI run proves the clickable skin green on the runner.
      - name: check-skin a133 a523 (ALL DEVICES PASS, native==qemu byte-identical)
        run: |
          docker run --rm --network none \
            --device /dev/uinput --device-cgroup-rule "c 13:* rmw" -v /dev/input:/dev/input \
            --cap-add SYS_ADMIN --security-opt apparmor=unconfined --security-opt seccomp=unconfined \
            "$IMG" check-skin a133 a523

      - name: Cleanup CI image
        if: always()
        run: docker image rm -f "$IMG" || true
